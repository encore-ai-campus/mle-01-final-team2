# 웹(Next.js) 타입 검사와 빌드. web/만 바뀌었을 때도 돌고, 파이썬 쪽만 바뀌면 돌지 않는다.
# 비밀값·API 서버 없이 돈다(API 주소는 실행 시점 환경변수라 빌드에 필요 없다).
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성
        run: npm ci --no-fund --no-audit
      - name: 타입 검사
        run: npm run typecheck
      - name: 빌드
        run: npm run build
