# 로컬 데이터 없이 도는 도구 시험과 확실한 오류 검사. DB(Aura)나 비밀값은 쓰지 않는다.
# tests/(팀원 코드)는 로컬 데이터 없이 도는 파일만 돌린다. 나머지는 data/condition_inputs/v1 등 로컬 전용 데이터가 있어야 한다.
name: tools-tests

# 문서만 바뀐 경우는 돌지 않는다. 바뀐 파일이 모두 아래 경로일 때만 건너뛰고, 코드가 하나라도 섞이면 돈다.
# 주의: 나중에 이 검사를 main의 필수 체크로 걸면, 건너뛴 PR이 "대기"로 남아 머지가 막힌다. 그때는 이 설정을 다시 본다.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.docx"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.docx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tools.txt
            requirements-dev.txt
      - name: 의존성
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "ruff==0.17.6"
      - name: uv.lock이 pyproject.toml과 맞는지
        run: |
          python -m pip install "uv==0.11.29"
          uv lock --check
      - name: 문법 오류(전체)
        run: ruff check . --select E9
      - name: 확실한 오류(그래프 도구)
        run: ruff check tools/graphrag tools/check_graph_neo4j.py tools/sync_graph_neo4j.py tools/test_graphrag.py tools/test_graph_ops.py tools/test_sync_graph.py tools/test_compare_path_impact.py tools/test_compare_schema_change.py tools/test_measure_service_latency.py tools/measure_service_latency.py tools/test_project_deps.py api agent deploy tools/requirement_review_queue.py tests/test_orchestration.py tests/test_requirement_review_queue.py tests/test_review_api.py tests/test_auth.py tests/test_deploy_check.py tests/test_api_skeleton.py tests/local_data.py --select F,E9
      - name: 도구 시험
        run: |
          for t in tools/test_*.py; do
            echo "== $t"
            python -m unittest "tools.$(basename "$t" .py)"
          done
      - name: 서버·에이전트·조건 시험(로컬 데이터 없이 도는 것)
        run: |
          python -m unittest tests.test_api tests.test_api_skeleton tests.test_agent tests.test_orchestration tests.test_requirement_review_queue tests.test_review_api tests.test_auth tests.test_deploy_check tests.test_condition_evaluation tests.test_condition_extractor tests.test_g2b_normalization tests.test_normalize_support_data
