# 로컬 개발용 구성: 웹(Next.js) + API + vLLM 대역 서버. 저장소 루트에서 실행한다. 웹: http://localhost:3000
#   docker compose -f deploy/docker-compose.yml up --build
#
# - api는 VLLM_BASE_URL=http://llm:8001/v1 로 대역 서버를 OpenAI 호환 API로 부른다.
#   RunPod vLLM이 준비되면 llm 서비스를 빼고 .env의 VLLM_BASE_URL·VLLM_MODEL·VLLM_API_KEY만 RunPod 값으로 둔다.
# - 판정 데이터(data/)는 이미지에 넣지 않고 읽기 전용으로 붙인다(원문·첨부는 git·이미지 밖, 로컬 전용).
# - 비밀 값은 저장소 루트 .env에서 읽는다(파일이 없어도 뜬다). 이 파일에 값을 적지 않는다.
# - AWS 서버 배포 구성(역방향 프록시·이미지 태그)은 아직 정하지 않았다(기초 설계서 §3, 미정).
name: jiwongak

services:
  llm:
    build:
      context: ..
      dockerfile: deploy/mock_vllm/Dockerfile
    environment:
      MOCK_MODEL: mock-qwen
      MOCK_TOKEN_DELAY_MS: "30"
    ports:
      - "127.0.0.1:8001:8001"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: local
      VLLM_BASE_URL: http://llm:8001/v1
      VLLM_MODEL: mock-qwen
      VLLM_API_KEY: ""
    volumes:
      - ../data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      llm:
        condition: service_healthy

  # 사용자 웹(Next.js). 브라우저는 web만 부르고, web 서버가 api로 SSE를 중계한다.
  web:
    build:
      context: ../web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
