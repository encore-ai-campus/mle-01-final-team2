<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수기 정규화 도우미</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#23211d;--sub:#6b675e;--line:#dedbd2;--accent:#2f6f5e;--accent-bg:#e3f1ec;--warn:#9a5b00;--warn-bg:#fff3d6;--err:#a32d2d;--err-bg:#fdeaea;--ok:#2e6b2e;--ok-bg:#e8f4e3;--g:#6a4fb3;--g-bg:#efeafa}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262522;--ink:#ece9e1;--sub:#a29e92;--line:#3b3934;--accent:#6fc2a8;--accent-bg:#23382f;--warn:#f0b659;--warn-bg:#3b2f17;--err:#f09090;--err-bg:#3d2020;--ok:#8fd08f;--ok-bg:#223320;--g:#b5a1ee;--g-bg:#2c2640}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .sp{flex:1}
select,input[type=text],input[type=number],textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.small{padding:2px 8px;font-size:13px}
button.danger{color:var(--err)}
.tabs{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent;color:var(--sub)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;border-color:var(--line)}
main{display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:12px;padding:0 16px 40px}
main.single{grid-template-columns:1fr}
#viewer[hidden]{display:none}
#viewer{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#packet{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;margin:8px 0 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
mark{background:#ffe27a;color:#000}
#seltool{position:fixed;display:none;z-index:50;background:var(--ink);color:var(--bg);padding:6px;border-radius:8px;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#seltool button{background:var(--accent);color:#fff;border:none}
h2{font-size:17px;margin:4px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.row>label{min-width:84px;color:var(--sub);font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--card)}
.card.req{border-left:4px solid var(--accent)}
.card.grp{border-left:4px solid var(--g);background:var(--g-bg)}
.card.cond{background:var(--bg)}
.badge{display:inline-block;padding:0 8px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:600}
.badge.g{background:var(--g-bg);color:var(--g)}
.tip{background:var(--accent-bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:13.5px}
.err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:13.5px}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:13px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--sub)}
.dropzone.hot{border-color:var(--accent);background:var(--accent-bg)}
.chips span{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.chips span b{cursor:pointer;margin-left:4px;color:var(--err)}
.status{font-size:13px;color:var(--sub)}
.step{display:flex;gap:10px;margin:8px 0}.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:600}
@media (max-width:900px){main{grid-template-columns:1fr}#viewer{position:static;max-height:50vh}}
</style>
</head>
<body>
<header>
  <h1>수기 정규화 도우미</h1>
  <span class="status" id="privacy" title="이 페이지는 인터넷으로 아무것도 보내지 않습니다">내 컴퓨터 안에서만 동작</span>
  <span class="sp"></span>
  <label>검수자 이름 <input type="text" id="reviewer" size="8" placeholder="예: kwan"></label>
  <label>공고 <select id="noticeSel"></select></label>
  <span id="timerBox"><button class="small" id="timerBtn" title="이 공고를 읽고 쓰는 시간을 잽니다">▶ 시간 재기</button> <span id="timerOut" class="muted"></span></span>
  <span id="saveState" class="status"></span>
</header>
<div class="tabs" id="tabs"></div>
<main id="main">
  <section id="viewer" class="panel" hidden>
    <div class="row"><b>공고 원문(자료 패킷)</b><span class="sp"></span><input type="text" id="find" placeholder="원문에서 찾기" size="14"></div>
    <div class="muted">글자를 드래그하면 [근거로 쓰기] 버튼이 나타납니다. 직접 옮겨 적지 말고 이 방법을 쓰면 원문과 한 글자도 다르지 않게 복사됩니다.</div>
    <pre id="packet"></pre>
  </section>
  <section id="editor"></section>
</main>
<div id="seltool"><button id="useBasis">근거로 쓰기</button><button id="useExtra">추가 근거</button></div>
<input type="file" id="fileAny" multiple hidden>
<input type="file" id="fileDir" webkitdirectory directory multiple hidden>

<script id="core">
/* ===== 점검 규칙(tools/goldset_check.py와 같은 규칙). DOM을 쓰지 않는다. ===== */
(function (root) {
  const ATTRS = ["region","zone","industry","applicant_type","business_age","founder_age","company_size","revenue","employees","certification","prior_award","registration","other"];
  const OPS = ["EQ","LT","LTE","GT","GTE","BETWEEN","IN","WITHIN","IS_A","EXISTS"];
  const KINDS = ["ELIGIBILITY","EXCLUSION","PREFERENCE","DOCUMENT","LIMIT","CRITERION"];
  const LOGICS = ["AND","OR","NONE_OF","AT_LEAST"];
  const REF_KINDS = ["NONE","NOTICE_DATE","DEADLINE","PREV_YEAR","OTHER"];
  const NEEDS_REF = ["business_age","founder_age","revenue","employees"];
  const RESULTS = ["SATISFIED","UNSATISFIED","UNKNOWN"];
  const OVERALL = ["ELIGIBLE","NOT_ELIGIBLE","NEEDS_CHECK"];
  const REASONS = ["ASSUMED_LOGIC","REQ_UNPARSED","OPEN_ENDED","PROFILE_MISSING_ATTR","NEEDS_DEFINITION","SOURCE_CONFLICT","BOUNDARY_UNCLEAR","TRACK_SPLIT"];
  const has = (a, v) => a.indexOf(v) >= 0;
  const norm = s => String(s == null ? "" : s).replace(/\s+/g, "");
  const falsy = v => v == null || v === "" || v === false || v === 0 || (Array.isArray(v) && !v.length);
  const isGroup = c => Array.isArray(c.children) && c.children.length > 0;

  function leaves(conds, rid, errs, depth, out) {
    depth = depth || 0; out = out || [];
    (conds || []).forEach(c => {
      if (isGroup(c)) {
        const cid = c.cond_id == null ? "?" : c.cond_id;
        if (!has(LOGICS, c.logic)) errs.push(`${rid}/${cid}: 그룹의 logic 값 오류 ${c.logic == null ? "None" : c.logic}`);
        if (c.logic === "AT_LEAST" && falsy(c.min_count)) errs.push(`${rid}/${cid}: 그룹이 AT_LEAST인데 min_count 없음`);
        if (depth >= 3) { errs.push(`${rid}/${cid}: 그룹 중첩이 3단을 넘음`); return; }
        leaves(c.children, rid, errs, depth + 1, out);
      } else out.push(c);
    });
    return out;
  }

  function validateA(a, packet) {
    const errs = [];
    ["notice_id","reviewer","requirements","ambiguities"].forEach(k => { if (!(k in a)) errs.push(`필수 필드 없음: ${k}`); });
    const seen = {}; const ptxt = norm(packet);
    (a.requirements || []).forEach(r => {
      const rid = r.req_id == null ? "?" : r.req_id;
      if (!has(KINDS, r.kind)) errs.push(`${rid}: kind 값 오류 ${r.kind == null ? "None" : r.kind}`);
      if (!has(LOGICS, r.logic)) errs.push(`${rid}: logic 값 오류 ${r.logic == null ? "None" : r.logic}`);
      if (r.logic === "AT_LEAST" && falsy(r.min_count)) errs.push(`${rid}: AT_LEAST인데 min_count 없음`);
      if (!r.source_sentence) errs.push(`${rid}: source_sentence 없음(근거 필수)`);
      else if (ptxt && ptxt.indexOf(norm(r.source_sentence)) < 0) errs.push(`${rid}: source_sentence가 자료 패킷에 그대로 없음(원문 복사 여부 확인, 첨부 원문에서 온 문장이면 패킷에 없을 수 있음)`);
      leaves(r.conditions, rid, errs).forEach(c => {
        const cid = c.cond_id == null ? "?" : c.cond_id;
        if (seen[cid]) errs.push(`${rid}/${cid}: cond_id 중복`);
        seen[cid] = 1;
        if (!has(ATTRS, c.attribute)) errs.push(`${rid}/${cid}: attribute 허용 목록 밖 ${c.attribute == null ? "None" : c.attribute}`);
        if (!has(OPS, c.operator)) errs.push(`${rid}/${cid}: operator 허용 목록 밖 ${c.operator == null ? "None" : c.operator}`);
        if (has(NEEDS_REF, c.attribute) && (c.ref_date_kind == null || c.ref_date_kind === "NONE") && (r.kind === "ELIGIBILITY" || r.kind === "EXCLUSION"))
          errs.push(`${rid}/${cid}: ${c.attribute}는 기준일(ref_date_kind)을 적어야 함(원문에 없으면 OTHER와 note)`);
        if (!(c.ref_date_kind == null || has(REF_KINDS, c.ref_date_kind))) errs.push(`${rid}/${cid}: ref_date_kind 값 오류`);
        if ((c.attribute === "company_size" || c.attribute === "applicant_type") && !c.needs_definition && c.operator === "IS_A")
          errs.push(`${rid}/${cid}: 법령·제도 용어면 needs_definition=true (정의 뜻은 쓰지 않음)`);
      });
    });
    if (!(a.requirements && a.requirements.length) && !(a.ambiguities && a.ambiguities.length)) errs.push("요건이 없는데 ambiguities에 이유가 없음");
    return errs;
  }

  function allCondIds(a) {
    const out = {};
    const walk = cs => (cs || []).forEach(c => { out[c.cond_id] = 1; walk(c.children); });
    ((a || {}).requirements || []).forEach(r => walk(r.conditions));
    return out;
  }
  const judgmentsOf = b => b.judgments ? b.judgments : ("profile_id" in b ? [b] : []);

  function validateB(b, a, profs) {
    const errs = []; const ids = allCondIds(a); const hasIds = Object.keys(ids).length > 0;
    const js = judgmentsOf(b);
    if (!js.length) errs.push("판정이 없음");
    js.forEach(j => {
      const pid = j.profile_id == null ? "None" : j.profile_id;
      if (!(j.profile_id in profs)) errs.push(`${pid}: 알 수 없는 프로필(profiles.json/profiles_extra.json 확인)`);
      if (!has(OVERALL, j.overall)) errs.push(`${pid}: overall 값 오류 ${j.overall == null ? "None" : j.overall}`);
      (j.conditions || []).forEach(c => {
        if (!has(RESULTS, c.result)) errs.push(`${pid}/${c.cond_ref == null ? "None" : c.cond_ref}: result 값 오류`);
        if (hasIds && !(c.cond_ref in ids)) errs.push(`${pid}: cond_ref ${c.cond_ref == null ? "None" : c.cond_ref}가 라벨 A에 없음`);
      });
      (j.reason_codes || []).forEach(rc => { if (!has(REASONS, rc)) errs.push(`${pid}: reason_code 허용 목록 밖 ${rc}`); });
    });
    return errs;
  }

  /* 막지는 않지만 확인하면 좋은 것(가이드 §7 체크리스트) */
  function hintsA(a, packet) {
    const out = [];
    (a.requirements || []).forEach(r => {
      const rid = r.req_id, s = r.source_sentence || "";
      if (/등\s*[)\]]?\s*$/.test(s.trim()) && !r.open_ended) out.push(`${rid}: 문장이 "…등"으로 끝납니다. 목록 전체를 알 수 없다면 '열린 목록'에 체크하세요.`);
      if (/(모두|하나\s*이상|다음\s*중|중\s*\d+\s*개|각\s*호)/.test(s) && r.logic_basis !== "explicit") out.push(`${rid}: 원문에 "모두·하나 이상·다음 중 N개" 같은 표현이 있습니다. 논리 근거를 '원문에 명시'로 바꿀 수 있는지 보세요.`);
      if (r.kind === "EXCLUSION" && r.logic !== "NONE_OF") out.push(`${rid}: 제외 요건은 보통 논리를 '하나라도 해당하면 제외(NONE_OF)'로 씁니다.`);
      if (r.status === "unparsed" && r.kind === "ELIGIBILITY") out.push(`${rid}: 읽을 수 없는 자격 요건이 있으면 판정은 NEEDS_CHECK가 됩니다(라벨 B에서 reason_codes에 REQ_UNPARSED).`);
      if (/중소기업|소상공인|창업기업|여성기업|장애인기업|벤처기업|사회적기업|소기업|중기업/.test(s)) {
        const anyDef = leaves(r.conditions, rid, []).some(c => c.needs_definition);
        if (!anyDef) out.push(`${rid}: 법령·제도 용어(중소기업·소상공인 등)가 보입니다. 해당 조건에 '정의 확인 필요'를 체크했는지 확인하세요.`);
      }
      leaves(r.conditions, rid, []).forEach(c => {
        if (c.attribute === "other" && !c.note) out.push(`${rid}/${c.cond_id}: '기타' 조건에는 메모(note)에 이유나 제안 이름을 적어 주세요.`);
      });
      if ((r.conditions || []).length === 0 && r.status === "parsed") out.push(`${rid}: 조건이 하나도 없습니다. 원문에 확인 가능한 조건이 없다면 이 요건을 지우고 '모호한 점'에 이유를 적으세요.`);
    });
    if (!(a.ambiguities && a.ambiguities.length)) out.push("'모호한 점'이 비어 있습니다. 확신이 없었던 곳을 적어 주세요(가이드 개정의 재료입니다). 정말 없다면 '없음'이라고 적습니다.");
    if (a.time_minutes == null) out.push("작업 시간(time_minutes)이 비어 있습니다. 위쪽 '시간 재기'를 쓰거나 직접 적어 주세요.");
    return out;
  }

  /* "7년 이내", "만 39세 이하", "10인 미만", "3억원 이상" -> {op, num, kind} */
  function parsePhrase(t) {
    t = String(t || "").replace(/,/g, "");
    const m = t.match(/(\d+(?:\.\d+)?)\s*(년|개월|세|인|명|조|억|천만|백만|만)?\s*(?:원)?\s*(이내|이하|미만|이상|초과)/);
    if (!m) return null;
    const op = { 이내: "LTE", 이하: "LTE", 미만: "LT", 이상: "GTE", 초과: "GT" }[m[3]];
    const unit = m[2] || "";
    const mul = { 조: 1e12, 억: 1e8, 천만: 1e7, 백만: 1e6, 만: 1e4 }[unit];
    return { op: op, num: Number(m[1]), unit: unit, krw: mul ? Number(m[1]) * mul : null, word: m[3] };
  }

  /* ---- ZIP(저장만, 압축 없음) ---- */
  const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function makeZip(files) {
    const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
    const w16 = (v, n) => { v[0] = n & 255; v[1] = (n >> 8) & 255; };
    files.forEach(f => {
      const name = enc.encode(f.name); const data = f.data; const crc = crc32(data);
      const h = new Uint8Array(30 + name.length); const dv = new DataView(h.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true); dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
      dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true); h.set(name, 30);
      parts.push(h, data);
      const c = new Uint8Array(46 + name.length); const cv = new DataView(c.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true); cv.setUint32(42, off, true); c.set(name, 46); central.push(c);
      off += h.length + data.length;
    });
    const csize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array(22); const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true); ev.setUint32(12, csize, true); ev.setUint32(16, off, true);
    const all = parts.concat(central, [end]); const total = all.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(total); let p = 0; all.forEach(x => { out.set(x, p); p += x.length; }); return out;
  }

  root.LabelerCore = { ATTRS, OPS, KINDS, LOGICS, REF_KINDS, NEEDS_REF, RESULTS, OVERALL, REASONS, norm, leaves, validateA, validateB, hintsA, allCondIds, judgmentsOf, parsePhrase, crc32, makeZip };
  if (typeof module !== "undefined") module.exports = root.LabelerCore;
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script id="app">
(function () {
const C = window.LabelerCore;
const DEFAULT_PROFILES = /*__PROFILES__*/[];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 용어(한글 설명) ---------- */
const KIND_INFO = { ELIGIBILITY: ["신청 자격", "이 조건을 만족해야 신청할 수 있다"], EXCLUSION: ["신청 제외", "이 조건에 해당하면 신청할 수 없다"], PREFERENCE: ["우대", "가점·우선 선정(판정에는 쓰지 않음)"], DOCUMENT: ["제출 서류", "내야 하는 서류(판정에는 쓰지 않음)"], LIMIT: ["한도·의무", "지원 한도, 횟수, 선정 후 의무(판정에는 쓰지 않음)"], CRITERION: ["평가·선정 기준", "점수 배점 등(판정에는 쓰지 않음)"] };

function storeKey() { return "labeler:v1:" + (S.reviewer || "anon"); }
function save() {
  try {
    const slim = { reviewer: S.reviewer, current: S.current, assignment: S.assignment, titles: S.titles, notices: {} };
    Object.values(S.notices).forEach(n => { slim.notices[n.id] = { id: n.id, title: n.title, A: n.A, B: n.B, secs: n.secs, check: n.check, bsel: n.bsel }; });
    localStorage.setItem(storeKey(), JSON.stringify(slim));
    $("#saveState").textContent = "자동 저장됨 " + new Date().toLocaleTimeString();
  } catch (e) { $("#saveState").textContent = "자동 저장 불가(내려받기를 자주 하세요)"; }
}
function restore() {
  try {
    const raw = localStorage.getItem(storeKey()); if (!raw) return false;
    const d = JSON.parse(raw);
    Object.values(d.notices || {}).forEach(n => { const x = ensureNotice(n.id); Object.assign(x, { title: n.title, A: n.A, B: n.B, secs: n.secs || 0, check: n.check || {}, bsel: n.bsel || [] }); });
    S.assignment = Object.assign({}, d.assignment, S.assignment); S.titles = Object.assign({}, d.titles, S.titles);
    if (!S.current && d.current && S.notices[d.current]) S.current = d.current;
    return true;
  } catch (e) { return false; }
}

/* ---------- 파일 읽기 ---------- */
function parseCsv(text) {
  text = text.replace(/^﻿/, ""); const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; } else if (c !== "\r") cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); } return rows;
}
async function ingest(files) {
  const log = [];
  for (const f of files) {
    const path = (f.webkitRelativePath || f.name).replace(/\\/g, "/"), name = f.name;
    try {
      const text = await f.text();
      if (/\.txt$/i.test(name) && /packets\//.test(path) || (/\.txt$/i.test(name) && /^#\s*[A-Z]+:/.test(text))) {
        const m = text.match(/^#\s*(\S+)/); const id = m ? m[1] : name.replace(/\.txt$/i, "").replace("_", ":");
        const n = ensureNotice(id); n.packet = text; const t = text.match(/^제목:\s*(.+)$/m); if (t) { n.title = t[1].trim(); S.titles[id] = n.title; }
        log.push("원문 " + id);
      } else if (name === "profiles.json" || name === "profiles_extra.json") {
        (JSON.parse(text).profiles || []).forEach(p => S.profiles[p.profile_id] = p); log.push("프로필 " + name);
      } else if (name === "profiles_assignment.csv") {
        parseCsv(text).slice(1).forEach(r => { const ids = r.slice(1, 6).map(x => x.trim()).filter(Boolean); if (r[0] && ids.length) S.assignment[r[0].trim()] = ids; }); log.push("프로필 배정표");
      } else if (name === "pilot_assignment.csv") {
        parseCsv(text).slice(1).forEach(r => { if (r[1] && r[3]) S.titles[r[1]] = r[3]; ensureNotice(r[1]); }); log.push("공고 배정표");
      } else if (/\.json$/i.test(name)) {
        const d = JSON.parse(text);
        if (d.requirements !== undefined && d.notice_id) {
          const n = ensureNotice(d.notice_id);
          if (/templates\//.test(path) || /label_A\.json$/.test(name) && !(d.requirements || []).length) { n.A.materials = d.materials || n.A.materials; log.push("서식 " + d.notice_id); }
          else { n.A = Object.assign(newA(d.notice_id), d); if (!n.A.reviewer && S.reviewer) n.A.reviewer = S.reviewer; log.push("라벨 A 불러옴 " + d.notice_id); }
        } else if (d.judgments !== undefined && d.notice_id) {
          if (/templates_B\//.test(path)) continue;
          const n = ensureNotice(d.notice_id); n.B = Object.assign(newB(d.notice_id), d); n.bsel = (d.judgments || []).map(j => j.profile_id).filter(Boolean); log.push("라벨 B 불러옴 " + d.notice_id);
        }
      }
    } catch (e) { log.push("읽지 못함: " + name + " (" + e.message + ")"); }
  }
  if (!S.current) { const ids = Object.keys(S.notices); if (ids.length) S.current = ids[0]; }
  save(); fillNoticeSel(); render();
  $("#loadlog") && ($("#loadlog").textContent = log.length ? "불러온 것: " + log.join(", ") : "읽을 수 있는 파일이 없습니다.");
}

/* ---------- 경로 기반 편집 ---------- */
function getPath(root, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), root); }
function setPath(root, path, val) { const ks = path.split("."); const last = ks.pop(); const o = ks.reduce((x, k) => x[k], root); o[last] = val; }
const ROOT = () => ({ A: N().A, B: N().B });
function conv(el) {
  const t = el.dataset.t;
  if (t === "bool") return el.checked;
  if (t === "num") { return el.value === "" ? null : Number(el.value); }
  if (t === "csv") return el.value.split(",").map(x => x.trim()).filter(Boolean);
  return el.value;
}
function nextCondId(A, prefix) {
  let max = 0; const walk = cs => (cs || []).forEach(c => { const m = String(c.cond_id).match(/^[CG](\d+)$/); if (m && String(c.cond_id)[0] === prefix) max = Math.max(max, Number(m[1])); walk(c.children); });

}

  return { label: "" };
}
function newCond(A, attr) { const c = { cond_id: nextCondId(A, "C"), attribute: attr || "business_age", operator: "LTE", value: null, ref_date_kind: "NONE", negate: false, concept: null, needs_definition: false, note: "" }; c.value = defaultValue(c); return c; }
function fixOperator(c) { const a = c.attribute; const grp = C.NEEDS_REF.includes(a) ? "numeric" : (a === "region" || a === "zone") ? "place" : (["applicant_type", "company_size", "industry"].includes(a)) ? "kind" : (["certification", "registration", "prior_award"].includes(a)) ? "exists" : "other"; const ok = S.allOps ? C.OPS : OPS_BY_ATTR[grp]; if (!ok.includes(c.operator)) c.operator = ok[0]; c.value = defaultValue(c); if (C.NEEDS_REF.includes(a) && (c.ref_date_kind == null || c.ref_date_kind === "NONE")) c.ref_date_kind = "NONE"; if ((a === "company_size" || a === "applicant_type")) c.needs_definition = true; }
function sectionBefore(text, sel) { const i = text.indexOf(sel); if (i < 0) return ""; const head = text.slice(0, i).match(/^##\s*(.+)$/gm); return head ? head[head.length - 1].replace(/^##\s*/, "").trim() : ""; }

function onAction(el) {
  const n = N(); const act = el.dataset.act; const R = n ? ROOT() : null; const p = el.dataset.p;
  switch (act) {
    case "addreq": { const A = n.A; const i = A.requirements.length + 1; A.requirements.push({ req_id: "R" + i, kind: "ELIGIBILITY", logic: "AND", logic_basis: "assumed", min_count: null, status: "parsed", open_ended: false, source_sentence: "", source: "", conditions: [] }); S.activeReq = A.requirements.length - 1; break; }
    case "addtrack": n.A.tracks.push({ track_id: "T" + (n.A.tracks.length + 1), name: "" }); break;
    case "addcond": getPath(R, p).push(newCond(n.A)); break;
    case "addgrp": { getPath(R, p).push({ cond_id: nextCondId(n.A, "G"), logic: "OR", children: [newCond(n.A)], note: "" }); break; }
    case "addstr": getPath(R, p).push(""); break;
    case "del": { const ks = p.split("."); const idx = Number(ks.pop()); const arr = getPath(R, ks.join(".")); if (confirm("삭제할까요?")) arr.splice(idx, 1); break; }
    case "activate": S.activeReq = Number(el.dataset.i); break;

    case "phrase": { const v = $("#ph-" + CSS.escape(p)).value; const r = C.parsePhrase(v); const c = getPath(R, p); if (!r) { alert('"7년 이내", "10인 미만"처럼 숫자와 이내·이하·미만·이상·초과가 들어 있어야 합니다.'); return; } c.operator = r.op; if (c.attribute === "revenue" && r.krw != null) { c.value.value = r.krw; } else c.value.value = r.num; break; }

    case "reason": { const j = n.B.judgments.find(x => x.profile_id === el.dataset.pid); const rc = el.dataset.rc; j.reason_codes = (j.reason_codes || []).filter(x => x !== rc); if (el.checked) j.reason_codes.push(rc); break; }
    case "cres": case "cwhy": { const j = n.B.judgments.find(x => x.profile_id === el.dataset.pid); const ref = el.dataset.ref; let c = j.conditions.find(x => x.cond_ref === ref); if (!c) { c = { cond_ref: ref, result: null, why: "" }; j.conditions.push(c); } if (act === "cres") c.result = el.value || null; else c.why = el.value; if (!c.result && !c.why) j.conditions = j.conditions.filter(x => x !== c); break; }

    default: return false;
  }
  return true;
}

  const z = $("#zipBtn"); if (z) z.onclick = () => { if (!S.reviewer) { alert("위쪽에 검수자 이름을 먼저 적어 주세요."); return; } zipAll(); };
  const oa = $("#oneA"); if (oa) oa.onclick = () => { const n = N(); if (n) download(fileId(n.id) + ".label_A.json", JSON.stringify(exportObj(n, "A"), null, 2)); };
  const ob = $("#oneB"); if (ob) ob.onclick = () => { const n = N(); if (n) download(fileId(n.id) + ".label_B.json", JSON.stringify(exportObj(n, "B"), null, 2)); };
  const m = $("#mins"); if (m) m.onchange = () => { const n = N(); n.A.time_minutes = m.value === "" ? null : Number(m.value); n.B.time_minutes = n.A.time_minutes; saveSoon(); };
  const rn = $("#readNew"); if (rn) rn.onkeydown = e => { if (e.key === "Enter" && rn.value.trim()) { N().A.read.push(rn.value.trim()); saveSoon(); render(); } };
}
function updateTimer() {
  const n = N(); const b = $("#timerBtn"); if (!n) { $("#timerOut").textContent = ""; return; }
  const secs = n.secs + (S.timerOn ? Math.round((Date.now() - S.timerAt) / 1000) : 0);
  b.textContent = S.timerOn ? "■ 시간 멈추기" : "▶ 시간 재기"; $("#timerOut").textContent = `${Math.floor(secs / 60)}분 ${secs % 60}초`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.tagName === "INPUT" && t.type === "checkbox") return; if (t.tagName === "SELECT" || t.tagName === "INPUT" && t.type !== "button") return;
  if (onAction(t)) { saveSoon(); render(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (el.id === "fileAny" || el.id === "fileDir") { ingest([...el.files]); el.value = ""; return; }
  if (el.id === "noticeSel") { stopTimer(); S.current = el.value; S.activeReq = 0; render(); save(); return; }
  if (el.id === "reviewer") { S.reviewer = el.value.trim(); localStorage.setItem("labeler:last", S.reviewer); restore(); Object.values(S.notices).forEach(n => { n.A.reviewer = S.reviewer; n.B.reviewer = S.reviewer; }); save(); render(); return; }
  if (!el.dataset) return;
  if (el.dataset.act) { if (onAction(el)) { saveSoon(); render(); } return; }
  if (el.dataset.p) { const n = N(); if (!n) return; setPath(ROOT(), el.dataset.p, conv(el)); saveSoon(); if (el.tagName === "SELECT" || el.type === "checkbox") render(); else refreshChecks(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "find") { S.find = el.value; renderPacket(); return; }
  if (el.dataset && el.dataset.p && el.tagName !== "SELECT" && el.type !== "checkbox") { const n = N(); if (!n) return; setPath(ROOT(), el.dataset.p, conv(el)); saveSoon(); }
});
function refreshChecks() { if (S.tab === "A" || S.tab === "B") render(); }

/* ---------- 원문에서 드래그 ---------- */
$("#packet").addEventListener("mouseup", () => {
  const s = window.getSelection(); const txt = s ? s.toString().trim() : ""; const tool = $("#seltool");
  if (!txt || S.tab !== "A") { tool.style.display = "none"; return; }
  const r = s.getRangeAt(0).getBoundingClientRect(); tool.style.display = "flex"; tool.style.left = Math.max(8, r.left) + "px"; tool.style.top = Math.max(8, r.top - 44) + "px"; tool.dataset.txt = txt;
});
document.addEventListener("mousedown", e => { if (!e.target.closest("#seltool") && !e.target.closest("#packet")) $("#seltool").style.display = "none"; });
function useSel(extra) {
  const n = N(); const tool = $("#seltool"); const txt = tool.dataset.txt; if (!n || !txt) return;
  if (!n.A.requirements.length) { alert("먼저 [+ 요건 카드 추가]를 눌러 카드를 만들어 주세요."); return; }
  const r = n.A.requirements[Math.min(S.activeReq, n.A.requirements.length - 1)];
  if (extra) { r.source_extra = r.source_extra || []; r.source_extra.push(txt); } else { r.source_sentence = txt; const sec = sectionBefore(n.packet || "", txt); if (sec && !r.source) r.source = sec; }
  tool.style.display = "none"; window.getSelection().removeAllRanges(); saveSoon(); render();
}
$("#useBasis").onclick = () => useSel(false); $("#useExtra").onclick = () => useSel(true);

/* ---------- 시간 재기 ---------- */
function stopTimer() { const n = N(); if (S.timerOn && n) { n.secs += Math.round((Date.now() - S.timerAt) / 1000); } S.timerOn = false; save(); }
$("#timerBtn").onclick = () => { const n = N(); if (!n) return; if (S.timerOn) stopTimer(); else { S.timerOn = true; S.timerAt = Date.now(); } updateTimer(); };
setInterval(updateTimer, 1000);

/* ---------- 시작 ---------- */
S.reviewer = (localStorage.getItem("labeler:last") || ""); $("#reviewer").value = S.reviewer;
restore(); fillNoticeSel(); render();
window.LabelerApp = { S, ingest, onAction, render, exportObj, makePractice, zipAll, setReviewer: v => { S.reviewer = v; $("#reviewer").value = v; } };
})();
</script>
</body>
</html>
